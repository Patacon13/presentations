# Funciones recursivas - proceso

* Se llama a una función recursiva y se le envía el problema.
* La función analiza si se puede resolver el problema (caso base), si es así lo resuelve y termina.
* Si no se puede resolver, lo convierte en uno de menor complejidad y lo envía a otra instancia de su función.
* El proceso se repite hasta que llega a un caso que puede resolver, lo resuelve y termina.

---

# Tips para desarrollar funciones recursivas

* Cada llamada recursiva (a la misma función) debe definir un problema de menor complejidad.
* Debe existir por lo menos un caso base (o sera infinita!).
