### Ejercicio 9 - Guía 4
]

Eres parte de un equipo que gestiona una tienda de videojuegos. Tienen 7 productos con sus respectivos códigos y precios.

.center[

|1|29.87|
|2|53.45|
|3|12.76|
|4|78.32|
|5|45.19|
|6|64.55|
|7|17.92|
]

* Leer un par de valores código producto y cantidad vendida, para cada producto para cada día de la semana (de lunes a Sábado)

* Determinar el valor total facturado en la semana, que es la suma de todas las ganancias diarias.

.center[
### Ejercicio 16 - Guía 4
]

Un bot explorador necesita recorrer un planeta y puede hacerlo solo por coordenadas numeradas con números primos. Escribí un programa que le pida al usuario dos números enteros A y B (donde A < B) e indique cuántos números primos hay entre ellos (inclusive).

**Ejemplo**:

Entrada: A = 10, B = 20 -> Salida: Hay 4 números primos entre 10 y 20: 11, 13, 17, 19.

---

```C++
#include <iostream>
using namespace std;

int main(int argc, char *argv[]) {
  
  int a, b, aux, numero, div, contador_primos = 0;
  
  cout << "Ingrese dos numeros" << endl;
  cin >> a >> b;
  
  if (a > b) {
    aux = a;
    a = b;
    b = aux;
  }
  
  for (int i = a; i < b; i++) {
    div=2;
    while (i % div != 0 and div < i)
      div ++;
    
    if(div == i)
      contador_primos++;
  }
  
  cout << "Entre " << a << " y " << b << " hay " 
       << contador_primos << " numeros primos" 
       << endl;

  return 0;
}
```

---

#### Otra forma

```C++
#include <iostream>
using namespace std;
int main(int argc, char *argv[]) {
  int a, b, numero, div, contadorPrimos = 0;
  
  cout << "Ingrese dos numeros" << endl;
  cin >> a >> b;
  
  if (a > b) {
    int aux = a;
    a = b;
    b = aux;
  }
  
  for (int i = a; i <= b; i++) {
    int numeroDivisor = 2;
    bool esPrimo = true;
    if (i < 2) esPrimo = false;
    
    while (numeroDivisor < i and esPrimo) {
      if (i % numeroDivisor == 0) esPrimo = false;
      numeroDivisor++;
    }
    
    if (esPrimo) contadorPrimos++; 
  }
  
  cout << "La cantidad de primos es: " << contadorPrimos << endl;
  return 0;
}
```

.center[
### Beecrowd - 1113
]

Lea un número indeterminado de pares de enteros. Escriba un mensaje para cada par, indicando si estos dos números están en orden ascendente o descendente.

**Entrada**:

La entrada cosnta de varios casos de prueba. Cada caso contiene dos enteros X e Y. La entrada finaliza cuando X = Y.

**Salida**:

Para cada caso de prueba imprima "Crescente" (creciente en portugués), si los valores de X e Y están en orden ascendente, caso contrario imprima "Decrescente" (decreciente en portugués).
