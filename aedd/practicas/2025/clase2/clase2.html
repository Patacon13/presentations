### Ejercicio 16 - Guía 2

¿Se pueden sumar dos caracteres? ¿Qué se obtiene?. Ingresar por teclado dos variables de tipo caracter X e Y. Sumar las variables y asignarle el resultado a X. Mostrar por pantalla los valores de X e Y. ¿Qué pasa si ingreso un caracter numérico?

.center[
### Promedio 2 - Beecrowd (1006)
]



Leer tres valores (variables A, B y C), que son las tres notas de estudiantes. Entonces, calcule el promedio, considerando que la nota A tiene peso 2, la nota B tiene peso 3 y la nota C tiene peso 5. Cosiderar que cada nota puede ser del 0 al 10.0, siempre con un punto decimal.

**Entrada**

El archivo de entrada contiene 3 valores de punto flotante (double) con un dígito decimal después de la coma.

**Salida**

Imprime el mensaje "MEDIA" (Promedio en Portugués) y el promedio de los estudiantes de acuerdo con el siguiente ejemplo, con un espacio en blanco antes y después del signo igual.

**Ejemplo**

|Entrada|Salida|
|---|---|
|5.0 6.0 7.0|MEDIA = 6.3
|5.0 10.0 10.0|MEDIA = 9.0
|10.0 10.0 5.0|MEDIA = 7.5

---

.center[
### Solucion
]

```C++
#include <iostream>
using namespace std;

int main(int argc, char *argv[]) {
  
  double primeraNota;
	double segundaNota;
	double terceraNota;
	double media;

	cin>>primeraNota;
	cin>>segundaNota;
	cin>>terceraNota;

  media = ((primeraNota * 2) + (segundaNota * 3 + (terceraNota * 5))) / 10;
  cout<<fixed<<setprecision(1);
  cout<<"MEDIA = "<<media<<endl;
  
  return 0;
}  
```

.center[
### Ejercicio 13 - Guía 2
]

En el marco de la programación en C++, se te propone implementar un programa que calcule el área de un círculo en base a un valor de radio leido por teclado. Para el mismo programa, deberás mostrar 3 resultados del área obtenida. Cada resultado deberá ser calculado en base a una representación de PI basada en:

* Una constante literal.
* Una constante definida.
* Una constante declarada.

---

.center[
### Solucion
]

```C++
#include <iostream>
#define PI_DEFINIDA 3.14159
using namespace std;
  
int main(int argc, char *argv[]) {
    
  double radio;
    
  const double PI_DECLARADA = 3.14159;
    
  cout << "Ingrese el radio del círculo" << endl;
  cin >> radio;
    
  cout << "Usando constante literal: " << 3.14159 * radio * radio << endl;
  cout << "Usando constante definida: " << PI_DEFINIDA * radio * radio << endl;
  cout << "Usando constante declarada: " << PI_DECLARADA * radio * radio << endl;
    
  return 0;
}
```
