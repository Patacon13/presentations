* En C++, además de los strings, existen los arreglos de caracteres (cadenas).

--

* Como no podemos manejar tamaños dinámicos en archivos binarios por el acceso aleatorio, estamos obligados a usar cadenas.

---

Ejemplo:

```C++
struct Persona {
  string nombre;
  string apellido;
  int anioNacimiento;
};
struct PersonaArchivo {
  char nombre[50];
  char apellido[50];
  int anioNacimiento;
};
```

---

```C++
/*
*Para facilitar el guardado en el archivo se crea una función que transforma
*entre las estructuras.
*/
PersonaArchivo convertirAFormatoArchivo(Persona persona) {
  PersonaArchivo personaArchivo;
  
  strncpy(personaArchivo.nombre, persona.nombre.c_str(), 
          sizeof(personaArchivo.nombre) - 1);
  personaArchivo.nombre[sizeof(personaArchivo.nombre) - 1] = '\0';

  strncpy(personaArchivo.apellido, persona.apellido.c_str(), 
          sizeof(personaArchivo.apellido) - 1);
  personaArchivo.apellido[sizeof(personaArchivo.apellido) - 1] = '\0';

  personaArchivo.anioNacimiento = persona.anioNacimiento;
  return personaArchivo;
}
```

---

```C++
/*
* Para facilitar la lectura del archivo se crea una función que transforma
* entre las estructuras.
*/
Persona convertirDesdeFormatoArchivo(PersonaArchivo personaArchivo) {
  Persona persona;
  persona.nombre = string(personaArchivo.nombre);
  persona.apellido = string(personaArchivo.apellido);
  persona.anioNacimiento = personaArchivo.anioNacimiento;
  return persona;
}
```

# Archivos binarios

* Lectura de información

```c++
// Funcion
istream& read (char* s, streamsize n);
// Ejemplo
f.read((char *) &a, sizeof(a));
```

--

* Escritura en archivos

```c++
// Funcion
ostream& write (const char* s, streamsize n);
// Ejemplo
f.write((char *) &a, sizeof(a));
```

---

# Archivos binarios

* Operaciones
  * seekg: indica la posición del próximo get.
  * seekp: indica la posición del próximo put.
  * tellg: devuelve la posición del cursor dentro del archivo de lectura.
  * tellp: lo mismo del tellg, pero de escritura.
* Posiciones
  * ios::beg: Desplazamiento relativo al inicio del archivo.
  * ios::end: Desplazamiento relativo al final del archivo.
  * ios::cur: Desplazamiento relativo a la posición actual.

.center[
### Ejercicios - Guía práctica
Archivos - Ejercicio 2
]

Leer un archivo de texto (original.txt) y escribir en clave (enclave.txt). Escribirlo en clave no es más que sumar una cantidad al número en código ASCII de cada carácter. Esta cantidad deberá ingresarse por teclado.

---

```C++
int shift;
cout << "Ingresar desplazamiento (puede ser negativo): ";
cin >> shift;


ifstream archivoEntrada;
archivoEntrada.open("original.txt");

ofstream archivoSalida;
archivoSalida.open("enclave.txt"); 

if (!archivoEntrada || !archivoSalida) {
  cout << "No se pudo abrir los archivos" << endl;
}

else {
  char c;
  
  archivoEntrada.get(c);
  while(!archivoEntrada.eof()) {
    if (c != ' ') c += shift;
    cout << "imprimiendo" << " " << c << endl;
    archivoSalida << c;
    archivoEntrada.get(c);
  }
  
  
  
  archivoSalida.close();
  
  cout << "Listo. Archivo enclave.txt generado." << endl;
}
```

```C++
void copiarACampo(char[] dest, int maxlen, string& src) {
	strncpy(dest, src.c_str(), maxlen - 1);
	dest[maxlen - 1] = '\0';
}

```C++
void agregarRegistros(char[] nombreArchivo) {
	ofstream archivoSalida;
	archivoSalida.open(nombreArchivo, ios::binary | ios::out | ios::app);
	
	if (!archivoSalida) {
		cout << "No se pudo abrir " << nombreArchivo << " para escritura (binario).\n";
	}
	else {
		char seguir = 's';
		while (seguir == 's' || seguir == 'S') {
			Libro l = cargarLibroPorTeclado();
			archivoSalida.write((char *) &l, sizeof(l));
			if (!archivoSalida) {
				cout << "Error escribiendo registro.\n";
			}
			cout << "¿Cargar otro? (s/n): ";
			cin >> seguir;
		}
		
	}
	
}
```
