  bool encontrado = false;

  while (!encontrado and i < tam) {

# Búsqueda binaria

int busquedaBinaria(int arreglo[], int tam, int elemento) {
  a = -1;
  b = tam;
  while (b-a > 1) {
      c = (a+b)/2;
      if (arreglo[c] >= elemento)
          b = c;
      else
          a = c;
  }
  return b;
}
```

### Ejercicios

14) Escribir una función que permita rotar una posición a la izquierda todos los elementos del vector. La rotación es circular (el elemento en la posición cero se desplaza “circularmente” a la última posición del vector).
Ejemplo:
rotar_izquierda([1,2,3,4], 4) → [2,3,4,1]

```C++
void rotar_izquierda(int arreglo[], int tam) {
  if (tam > 0) {
    int elementoCero = arreglo[0];
    for (int i = 0; i < tam - 1; i++) arreglo[i] = arreglo[i + 1];
    arreglo[tam - 1] = elementoCero;
  }
  else cout << "No se puede rotar un arreglo de tamaño 0" << endl;
}
```

1) Implementar una función que reciba dos listas (arreglos) ordenadas junto con sus respectivos
tamaños lógicos y devuelva una nueva lista que contenga todos los elementos de las dos
listas originales.

```C++
void combinaListas(int arreglo1[], int tam1, int arreglo2[], int tam2, int arreglo3[], int & tam3) {
  for (int i = 0; i < tam1; i++) {
    arreglo3[tam3] = arreglo1[i];
    tam3++;
  }

  for (int i = 0; i < tam2; i++) {
    arreglo3[tam3] = arreglo2[i];
    tam3++;
  }
}
```
