.center[
### Ejercicio 9 - Guía 3
]

Escribir un programa que dado un número del 0 al 9, escriba en pantalla los números restantes
hasta el 10.

**Ejemplo:**

Ingrese un número del 1 al 10: 7

8

9

---

```C++
int main(int argc, char *argv[]) {

  int numero;
  cout << "Ingrese un numero (entre 0 y 9)"<<endl;
  cin >> numero;
  
  switch(numero){
    
  case 0:
		cout << "1\t";
	case 1:
		cout << "2\t";
	case 2:
		cout << "3\t";
	case 3:
		cout << "4\t";
	case 4:
		cout << "5\t";
	case 5:
		cout << "6\t";
	case 6:
		cout << "7\t";
	case 7:
		cout << "8\t";
	case 8:
		cout << "9\t";
	case 9:
		cout << "10\t";
    break;
  default:
    cout << "Se ingreso un numero fuera del rango" << endl;
  };
}  
```

.center[
### Beecrowd - 1048
]

La empresa ABC decidió dar un aumento salarial a sus empleados, según la siguiente tabla:

0 - 400.00 -> 15%

400.01 - 800.00 -> 12%

800.01 - 1200.00 -> 10%

1200.01 - 2000.00 -> 7%

Por encima de 2000.00 -> 4%

Lea el salario del empleado, calcule e imprima el nuevo salario del empleado, así como el dinero ganado y el porcentaje de aumento obtenido. 

**Entrada**

La entrada contiene un solo número de punto flotante, con 2 dígitos luego del punto decimal.


**Salida**

Imprimir el número correspondiente informando el nuevo salario, el dinero extra (mostrar con dos cifras decimales) y el porcentaje obtenido.

.center[
### Ejercicio 11 - Guía 3
]

Un número entero positivo se dice alternante si está compuesto de una secuencia de dígitos que alterna entre uno par y otro impar. Desarrollar un programa que permita ingresar un número de cinco cifras y determine si es alternante.

**Ejemplos:**

* 18307 es alternante.
* 74120 no es alternante

---

.center[
### Ejercicio 1 - Guía 4
]

Eres un mago en entrenamiento y necesitas encontrar el número mágico. Para encontrar ese número debes  escribir un programa en C++ que haga lo siguiente:


* Pide al usuario que ingrese un número entre  [10000, 100000].
* Si el número es par, muestra un mensaje mágico: “¡Has encontrado un número mágico par!”
* Si el número es impar, muestra otro mensaje mágico: “¡Has encontrado un número mágico impar!”
* Si el usuario ingresa un valor fuera del rango, pídele que lo intente de nuevo hasta que proporcione una entrada válida.

---

.center[
### Solución
]

```C++
#include <iostream>
using namespace std;
  
int main(int argc, char *argv[]) {
    
  int numero_magico;
  cout << "Ingrese un numero entero." << endl;
  cin >> numero_magico;
    
  while (numero_magico > 100000 or numero_magico < 10000) {
    cout << "Intente con otro numero." << endl;
    cin >> numero_magico;
  }
    
  if (numero_magico % 2 == 0)
      cout << "Has encontrado un numero magico par!!" << endl;
    else
      cout << "Has encontrado un numero magico impar!!" << endl;
    
    return 0;
}
```
