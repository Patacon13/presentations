## Definición de algoritmo
"Conjunto finito y ordenado de pasos, que ejecutados de manera correcta, permite obtener un resultado o resolver un determinado problema."

.center[![ejemplo algoritmo con un lavado de manos](./lavarsemanos.png)]

---


## Características
* Eficaz: Debe resolver el problema.

--

* Finito: Debe tener un fin. Es decir, debe terminar su ejecución una vez finalizada una serie de pasos.

--

* Definido: No debe ser ambiguo.

--

* Preciso: Deben indicar que pasos seguir, y en que orden.

--

* Eficiente: El consumo de recursos debe ser aceptable.

--

* Legible: Se debe poder leer y entender facilmente.

### Ejercicios
Ejercicio 1 - Guía 1
]

Utilizando el Zinjai copia el siguiente programa en el editor. Luego, compílalo y ejecútalo. Observando el comportamiento resultante analizar: ¿Qué realiza el programa? ¿Cómo se estructura un programa en C++?

```C++
#include <iostream>
#include <string>
using namespace std;

int main() {
  string nombre;
  int edad;
  
  cout << "¿Cómo te llamas? ";
  cin >> nombre;
  cout << "¿Cuántos años tienes? ";
  cin >> edad;
  
  cout << "¡Hola, " << nombre << "! Tienes " << edad << " años." << endl;
  
  return 0;
}  
```

.center[
### Ejercicios
Ejercicio 2 - Guía 1
]

Escribe un programa que solicite al usuario que ingrese dos números, y luego muestre la suma, la diferencia, el producto y el cociente de los dos números.

Ejemplo:

Ingresa el primer número: 130

Ingresa el segundo número: 45

Suma: 175

Diferencia: 85

Producto: 5850

Cociente: 2

---

.center[
### Solucion
]

```C++
#include <iostream>
using namespace std;

int main(int argc, char *argv[]) {
  
  int primerOperando, segundoOperando;
  
  cout << "Ingresa el primer número: ";
  cin >> primerOperando;
  cout << "Ingresa el segundo número: ";
  cin >> segundoOperando;
  
  cout << "Suma: " << primerOperando + segundoOperando << endl;
  cout << "Diferencia: " << primerOperando - segundoOperando << endl;
  cout << "Producto: " << primerOperando * segundoOperando << endl;
  cout << "Cociente: " << primerOperando / segundoOperando << endl;
  
  return 0;
}  
```

.center[
### Ejercicios
Ejercicio 3 - Guía 1
]

Escribe un programa que solicite al usuario una temperatura en Celsius y luego convierta la temperatura a Fahrenheit utilizando la fórmula F = C * 1,8 + 32. Mostrar la temperatura en Celsius y Fahrenheit.

Ejemplo:

Ingresa la temperatura en Celsius: 36.2

36.2 grados Celsius es igual a 97.16 grados Fahrenheit.

---

.center[
### Solucion
]


```C++
#include <iostream>
using namespace std;

int main(int argc, char *argv[]) {
  float temperaturaCelsius;
  
  cout << "Ingresa la temperatura en Celsius: ";
  cin >> temperaturaCelsius;
  
  cout << temperaturaCelsius << " grados Celsius es igual a " 
       << temperaturaCelsius * 1.8 + 32 << " grados Fahrenheit." << endl;
  
  return 0;
}  
```
