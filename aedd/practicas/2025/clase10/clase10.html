# Funciones recursivas - proceso

* Se llama a una función recursiva y se le envía el problema.
* La función analiza si se puede resolver el problema (caso base), si es así lo resuelve y termina.
* Si no se puede resolver, lo convierte en uno de menor complejidad y lo envía a otra instancia de su función.
* El proceso se repite hasta que llega a un caso que puede resolver, lo resuelve y termina.

---

# Tips para desarrollar funciones recursivas

* Cada llamada recursiva (a la misma función) debe definir un problema de menor complejidad.
* Debe existir por lo menos un caso base (o sera infinita!).

.center[
### Ejercicio 2 - Guía 7
]

Escribir una función recursiva que calcule la suma de los dígitos de un número entero que son múltiplos de N.

**Ejemplos de uso**:

* sumaDigMul(1234,2) -> 6 
* sumaDigMul(44,4) -> 8
* sumaDigMul(7,3) -> 0 
* sumaDigMul(4,4) -> 4

---

```C++
#include <iostream>
using namespace std;

int sumDigMul(int, int);

int main(int argc, char *argv[]) {
  
  int n,d;
  
  cout << "Ingrese un numero y un divisor"<< endl;
  cin >> n >> d;
  
  cout << "La suma de los digitos divisibles por " << d << " es: "
       << sumDigMul(n,d) << endl;
  
  return 0;
}

int sumDigMul(int numero, int div) {
  int digito = numero % 10;
  
  if (numero < 10) {
    if (numero % div == 0) return numero;
    return 0;
  }
  
  if (digito % div == 0) return digito + sumDigMul(numero/10, div);
  return sumDigMul(numero/10, div);
      
}  
```

.center[
### Ejercicio 5 - Guía 7
]

Dado un número entero largo, imprimirlo en orden inverso. Resolverlo a través de una función recursiva

**Ejemplos de uso**:

* inverso(35891) -> 1 9 8 5 3
* inverso(7) -> 7

---

```C++
#include <iostream>
using namespace std;

void inverso(long);

int main(int argc, char *argv[]) {
  
  inverso(123456);
  
  return 0;
}

void inverso(long num) {
  
  if(num/10 > 0) {
    cout << num%10 << '\t';
    inverso(num/10);
  }
    
  cout << num << '\t';
  
}
```

.center[
### Ejercicio 6 - Guía 7
]

Escribir una función recursiva que transforme un número entero positivo a notación binaria

Ejemplos de uso:

* decBinario(41) -> 101001 
* decBinario(13) -> 1101

---

```C++
#include <iostream>
using namespace std;

unsigned decBinario(unsigned num);

int main(int argc, char *argv[]) {
  unsigned x;
  cout << "CONVERSOR DECIMAL A BINARIO"<<endl;
  while (cin >> x) {
    cout<< "decBinario(" << x << ") = " << decBinario(x)<<endl;
  }
  
  
  return 0;
}

unsigned int decBinario(unsigned int num) {
  
  if (num / 2 > 0) {
    return num % 2 + 10 * decBinario(num/2);
  }
  
  
  if (num % 2 == 0) return 0;

  return 1;
  
}
```
