# Simulacro de examen
]

Se está realizando un control a individuos expuestos a una sustancia experimental llamada X-23, que puede provocar mutaciones. De cada individuo se registra:

* ID numérico
* Edad
* Temperatura corporal
* Si mutó (1 para sí, 0 para no)

A partir de estos datos, se pide:

a) Mostrar el porcentaje de individuos no mutados cuya temperatura es mayor a 38.5°C.

b) Mostrar cuántos IDs son divisibles simultáneamente por 2 o por 11.

c) Mostrar la cantidad de individuos cuyo ID tiene dígitos repetidos.

d) Mostrar el promedio de edad de los individuos con ID divisible por 7 y que no mutaron.

La cantidad de individuos a procesar debe ser aleatoria entre 20 y 50.
