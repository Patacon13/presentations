.center[
### Ejercicio 10 - Concatenación de Extremos
]

**Objetivo:** Extraer prefijos y sufijos de longitud determinada y combinarlos.

**Especificaciones:**
* Solicite el ingreso de una frase.
* Extraiga los primeros 5 caracteres y los últimos 5 caracteres.
* Muestre por separado ambos segmentos y luego su concatenación.

**Restricción:** Asuma que la cadena ingresada posee al menos 5 caracteres.

**Ejemplo:**
```
Entrada: ComputaciónAvanzada
Primeros 5: Comput
Últimos 5:  nzada
Concatenación: Computnzada
```

---

.center[
### Solución - Ejercicio 10
]

```C++
#include <iostream>
#include <string>
using namespace std;

int main() {
    string frase;
    cout << "Entrada: ";
    cin >> frase;

    string primeros = frase.substr(0, 5);
    string ultimos  = frase.substr(frase.length() - 5, 5);

    cout << "Primeros 5: " << primeros << endl;
    cout << "Últimos 5: "  << ultimos  << endl;
    cout << "Concatenación: " << primeros + ultimos << endl;

    return 0;
}
```

## Estructura if

* Selección incompleta: Si sólo se desea realizar una acción en caso que la expresión booleana sea verdadera y no hay acción por el falso.

--

* Selección completa: Se evalúa una expresión booleana y según sea verdadera o falsa, se ejecuta una acción u otra; por cualquier caso la ejecución continúa con la sentencia siguiente al if. 

--

* Selección anidada: Una sentencia if es anidada cuando la acción de la rama verdadera y/o la rama falsa, son también una sentencia if.

.center[
### Ejercicio 4 - Guía 4
]

Un postulante a un empleo realiza un test de capacitación. Se ingresa por teclado la cantidad total de preguntas realizadas y la cantidad de preguntas contestadas correctamente. Se pide desarrollar un programa que informe el nivel obtenido por el postulante, según el porcentaje de respuestas correctas y sabiendo que:

* Nivel máximo: Porcentaje >= 90.
* Nivel medio: Porcentaje >= 75% y < 90%.
* Nivel regular: Porcentaje >= 50% y < 75%.
* Fuera de nivel: Porcentaje < 50%.

---

.center[
### Solución - Ejercicio 4
]

```C++
#include <iostream>
using namespace std;

int main() {
    int total, correctas;
    cout << "Total de preguntas: ";
    cin >> total;
    cout << "Respuestas correctas: ";
    cin >> correctas;

    float porcentaje = (correctas * 100.0) / total;

    if (porcentaje >= 90)
        cout << "Nivel máximo" << endl;
    else if (porcentaje >= 75)
        cout << "Nivel medio" << endl;
    else if (porcentaje >= 50)
        cout << "Nivel regular" << endl;
    else
        cout << "Fuera de nivel" << endl;

    return 0;
}
```

.center[
### Ejercicio 7 - Guía 4
]

Diseñe un algoritmo que lea un número de tres cifras y determine si es o no capicúa. Un número es capicúa si “se lee igual al derecho y al revés”.

**Ejemplo**:
* Si se ingresa 383, el programa retorna un mensaje indicando que es capicúa.
* Si se ingresa 473, el programa retorna un mensaje indicando que no es capicúa

---

.center[
### Solución - Ejercicio 7
]

```C++
#include <iostream>
using namespace std;

int main() {
    int num;
    cout << "Ingrese un número de tres cifras: ";
    cin >> num;

    int centena = num / 100;
    int unidad  = num % 10;

    if (centena == unidad)
        cout << num << " es capicúa" << endl;
    else
        cout << num << " no es capicúa" << endl;

    return 0;
}
```

.center[
### Ejercicio 6 - Guía 4
]


En un supermercado el cliente puede pagar con tarjeta de débito (opciones ‘d’ ó ‘D’), con Billetera
Santa Fe (opciones ‘b’ ó ‘B’) o con tarjeta de crédito (opciones ‘c’ o ‘C’), en 1 o 3 cuotas. El precio
final de la compra del cliente estará sujeto a las siguientes condiciones:

* Si el cliente paga con tarjeta de crédito deberá indicar si paga en 1 o 3 cuotas. Si el pago es en 1 cuota no habrá recargo. Si el pago es en 3 cuotas tendrá un recargo del 10% del monto total.
* Si el cliente paga con tarjeta de débito y el importe a pagar es superior a $3000 se le hace un 15% de descuento. En caso contrario no se aplica ningún descuento ni recargo.
* Si el cliente paga con Billetera Santa Fe, obtiene un descuento del 30% sobre el monto total.

Escribir un programa en C++ que permita leer por teclado el monto de la compra y su forma de pago, y que calcule el monto final a pagar por el cliente de acuerdo a la forma de pago elegida.
Cuando corresponda, especificar también el monto a pagar en cada cuota.

---

.center[
### Solución - Ejercicio 6
]

.small-code[
```C++
#include <iostream>
using namespace std;
int main() {
    float monto, total;
    char pago;
    cin >> monto >> pago;
    if (pago == 'c' || pago == 'C') {
        int cuotas;
        cin >> cuotas;
        if (cuotas == 3) {
            total = monto * 1.10;
            cout << "Total: $" << total << endl;
            cout << "Por cuota: $" << total / 3 << endl;
        } else {
            cout << "Total: $" << monto << endl;
        }
    } else if (pago == 'd' || pago == 'D') {
        if (monto > 3000)
            total = monto * 0.85;
        else
            total = monto;
        cout << "Total: $" << total << endl;
    } else if (pago == 'b' || pago == 'B') {
        total = monto * 0.70;
        cout << "Total: $" << total << endl;
    }
    return 0;
}
```
