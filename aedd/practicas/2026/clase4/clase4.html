.center[
### Ejercicio 5 - Guía 4
]

**Descripción**

Se solicita escribir el código requerido para poder ingresar desde el teclado un número de día de la semana (de 1 a 7) y un número de mes (de 1 a 12), y que imprima el nombre del día de la semana y el del mes correspondientes, en texto. Si el día o el mes ingresado es incorrecto entonces deberá mostrarse un mensaje de error que indique la situación.

**Ejemplos**
Si el usuario ingresa:
```text
3, 8
```
Su programa deberá mostrar:
```text
Martes y Agosto
```

Si el usuario ingresa:
```text
12, 7
```
Su programa deberá mostrar:
```text
Día inexistente.
```

---

.center[
### Solución (Parte 2)
]

```C++
#include<iostream>

using namespace std;

int  main()
{
	int dia, mes;
	
	cout << "Ingrese el dia de la semana (1-7): ";
	cin >> dia;
	cout << endl << "Ingrese el mes (1-12): ";
	cin >> mes;
	
	if(dia>7 || dia <1 || mes>12 || mes<1)
		cout << "Dia inexistente";
	else
		{
		cout << "Dia: ";
		switch(dia)
		{
		case 1: cout <<"Lunes"; break;
		case 2: cout <<"Martes";  break;
		case 3: cout <<"Miercoles"; break;
		case 4: cout <<"Jueves";  break;
		case 5: cout <<"Viernes"; break;
		case 6: cout <<"Sabado";  break;
		case 7: cout <<"Domingo"; break;
		}
```

.center[
### Ejercicio 9 - Guía 4]
Escribir un programa que dado un número del 0 al 9, escriba en pantalla los números restantes
hasta el 10.

**Ejemplo**
``` bash
Ingrese un número del 1 al 10: 7
8 9
```
---
.center[
### Solución]

```C++
#include <iostream>
using namespace std;

int main(int argc, char *argv[]) {
	int numero;
	cout << "Ingrese un numero (entre 0 y 9)"<<endl;
	cin >> numero;
	
	switch(numero){
	case 0:       cout<<"1\t";
	case 1:       cout<<"2\t";
	case 2:       cout<<"3\t";
	case 3:       cout<<"4\t";
	case 4:       cout<<"5\t";
	case 5:       cout<<"6\t";
	case 6:       cout<<"7\t";
	case 7:       cout<<"8\t";
	case 8:       cout<<"9\t";
	case 9:       cout<<"10\t";
		break;
	default:
		cout<<"Se ingreso un numero fuera del rango"<<endl;
	};
}
```
