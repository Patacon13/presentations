# Algunas funciones útiles

|Función|Descripción|
|---|---|
|sqrt(numero)|Devuelve la raíz cuadrada de un número|
|pow(numero, potencia)|Devuelve el número elevado a una potencia|

**Nota**: en ambas funciones es necesario incluir la librería cmath

---

# Ejemplo

```C++
#include "cmath.h"
using namespace std;

int main() {
  int numero;
  cout << "Ingrese un número" << endl;
  cin >> numero;

  int raiz = sqrt(numero);
  int potencia = pow(numero, 4);
  cout << "La raíz cuadrada del número es " << raiz << endl;
  cout << "El número potenciado a la 4 es " << potencia << endl;
}
```

### Funciones/procedimientos con pasaje por copia vs funciones con pasaje por referencia

```C++
#include <iostream>
using namespace std;
void procedimientoDePruebaCopia(int);
void procedimientoDePruebaReferencia(int &);

int main() {
  int numero = 0;
  
  procedimientoDePruebaCopia(numero);
  cout << "El valor del numero fuera del procedimiento es: " << numero << endl;
  
  procedimientoDePruebaReferencia(numero);
  cout << "El valor del numero fuera de la funcino es: " << numero << endl;

}

void procedimientoDePruebaCopia(int numero) {
  numero = 5;
  cout << "El numero dentro del procedimiento vale " << numero << endl;
}

void procedimientoDePruebaReferencia(int & numero) {
  numero = 5;
  cout << "El numero dentro del procedimiento vale " << numero << endl;
}
```

.center[
### Ejercicio 6 - Guía 6
]


Escribir una función que calcule la potencia de dos números (no usar pow), siendo su prototipo:

int potencia(int, int);

Donde el primer parámetro es la base y el segundo el exponente.

---

```C++
#include <iostream>
using namespace std;
  
int potencia(int, int);
  
int main(int argc, char *argv[]) {
    
  int num, exp;
  cout<<"Ingrese la base y el exponente"<< endl;
  cin >> num >>exp;
    
  cout << "La potencia "<< exp <<"ta de "<<num<<" es: "<< potencia(num,exp) << endl;
   
  return 0;
}
  
  
int potencia(int base, int exp) {
  int resul=1;
    
  for(int i=0; i<exp; i++) resul*=base;
    
  return resul;
}
```

.center[
### Ejercicio 3 - Guía 6
]

Escribir una función en C que determine si un número dado entero, mayor o igual que 0, es o no palíndromo. Un número es palíndromo cuando su lectura es idéntica tanto al derecho como al revés. La función debe devolver un true si el número es palíndromo, y false en caso contrario

**Ejemplo**:

Ejemplo de número palíndromo: palindromo(21412)--> true

Ejemplo de número no palíndromo: palindromo(16413)--> false

---

```C++
#include <iostream>
#include <cmath>
using namespace std;
  
bool palindromo(int);
  
int main(int argc, char *argv[]) {
 
  int numero;
  
  cout << "Ingrese un numero para saber si es palindromo: ";
  cin >> numero;
 
  if(palindromo(numero))
    cout << "Su numero es palindromo!!" << endl;
  else
    cout << "Su numero no es palindromo!!" << endl;
    
    
  return 0;
}

int cantidadCifras(int numero) {
  int cantidad = 1;
  while (numero >= 10) {
    cantidad++;
    numero /= 10;
  }
  return cantidad;
}
```

---

```C++  
bool palindromo(int numero) {
  bool esPalindromo = true;
    
  //151 es palindromo
  //151 / 100 = 1
  int divisor = pow(10, cantidadCifras(numero) - 1);
    
  while (numero >= 10 and esPalindromo) {
    int ultimaCifra, primeraCifra;
    primeraCifra = numero / divisor;
    ultimaCifra = numero % 10;
      
    if (primeraCifra != ultimaCifra) esPalindromo = false;
      
    //Si el numero es 151, quiero sacar la primera y la ultima cifra
    //151 % 100 = 15
    //15 / 10 = 5
    numero = (numero % divisor) / 10;
    divisor /= 100;
  }
    
  return esPalindromo;
}    
```

```C++

  else
    cout << "Su numero no es palindromo!!" << endl;
    
   
  return 0;
}
  
bool palindromo(int numero) {
    int derecho = numero;
    int reves = 0;
    
  while (numero > 0) {
    reves = reves*10 + (numero%10);
    numero /= 10;
  }
      
  return (reves == derecho);
}

.center[
### Ejercicio Bonus
]

Diseñar una función que reciba como parámetros tres números reales: a, b y c. La función debe devolver el menor y el mayor, retornando además un código que indique 1, 0 o -1 según si todos los números son distintos, si hay un par de números iguales ó si los tres números son iguales, respectivamente. Si todos los números son iguales, no existe menor ni mayor.

---

```C++
#include <iostream>
using namespace std;
int menorMayor(int,int,int,int&,int&);
  
int main(int argc, char *argv[]) {
    
  float x,y,z,menor,mayor, resultado;
  cout << "Ingrese tres numeros: ";
  cin >> x >> y >> z;
  resultado = menorMayor(x,y,z,menor,mayor);
  switch(resultado) {
  case -1:
    cout<<"Todos los numeros son iguales"<<endl;
    cout << x <<'\t'<< y <<'\t' << z<<endl;
    break;
  case 0:
    cout << "Hay un par de numeros iguales"<<endl;
    cout << "Mayor: " << mayor <<endl;
    cout << "Menor: " << menor <<endl;
    break;
  case 1:
    cout << "Todos los numeros son diferentes"<<endl;
    cout << "Mayor: " << mayor <<endl;
    cout << "Menor: " << menor <<endl;
    break;
  default:
    cout << "Resultado desconocido"<<endl;
  }
    
  return 0;
}
```


---

```C++
float menorMayor(float a, float b, float c, float &menor, float &mayor) {
  float codigoRetorno = -2;
    
  if (a == b && b == c) codigoRetorno = -1;
  else if (a == b || a == c || b == c) codigoRetorno = 0;
  else codigoRetorno = 1;
    
  menor = a;
  if (b < menor) menor = b;
  if (c < menor) menor = c;
    
  mayor = a;
  if (b > mayor) mayor = b;
  if (c > mayor) mayor = c;
    
    
  return codigoRetorno;
}
```
