# Auto

* Auto nos permite inferir el tipo de datos que la variable contendrá.

# Auto

* Auto nos permite inferir el tipo de datos que la variable contendrá.
* Al trabajar con la STL, es muy útil para la legibilidad del código.

---

# ¿Cómo utilizo auto?

--

```C++
auto x = 5;
auto y = "Soy una cadena de caracteres";
cout << x << endl;
cout << y << endl;
```

Nota al margen: y es una cadena de caracteres, es decir un arreglo de chars. Si en cambio lo igualaramos a un string, y sería un string.

--

```C++
map<char, int> m = {{'a', 1}, {'b', 2}, {'c', 3}};

//Recorrido visto en el taller
for (pair<char, int> thisPair : m) {
    cout << thisPair.first << ": " << thisPair.second << endl;
}
```

--

```C++
map<char, int> m = {{'a', 1}, {'b', 2}, {'c', 3}};

//Recorrido con auto
for (auto thisPair : m) {
    cout << thisPair.first << ": " << thisPair.second << endl;
}
```

# ¿Y si usamos auto?

---

### Declaración e inicialización

```c++
auto it = nombreDeEstructura.begin();
```

---

### Suponiendo el código:

```c++
set<int> miSet = {1, 4, 5, 6, 8};
auto it = miSet.begin();
```

--

### Acceso al elemento

```c++
cout << *it << endl;
```

--

### Acceso al siguiente elemento

```c++
it++;
cout << *it << endl; //4
```

--

### Acceso al elemento anterior

```c++
it--;
cout << *it << endl; //1
```

---

### Recorrido con iteradores

```c++
for (auto it = miSet.begin(); it != miSet.end(); it++) {
    //código
}
```

--

### Recorrido con iteradores con condiciones

```c++
auto it = miSet.begin();
while (it != miSet.end() and otraCondicion) {
    //codigo
}
```

---

### Función find()

```c++
auto it = s.find(x);
if (it == s.end()) {
   // x no está en la estructura
}
```

--

### Función lower_bound() y upper_bound()

* lower_bound() retorna un iterador al elemento mayor o igual a x
* upper_bound() retorna un iterador al elemento más grande a x

```c++
set<int> s = {1, 4, 6, 7, 8};
auto it = s.lower_bound(5); //*it vale 6
auto it2 = s.upper_bound(5); //*it vale 6
auto it3 = s.lower_bound(6); //*it vale 6
auto it4 = s.upper_bound(6); //*it vale 7
```

# Ejemplo de aplicación

**Problema:**

Ayelén es una gran matemática reconocida en todo el mundo por sus aportes con distintos teoremas, definiciones y cuestiones que la gran mayoría de la gente no logra comprender. Son tales sus aportes, que trabaja constantemente con fórmulas muy extensas con muchos paréntesis, llaves y corchetes que abren y cierran operaciones enormes con cálculos solo entendibles para algunas mentes brillantes. Como Ayelén no trabaja sola, le solicitó a sus ayudantes que realicen distinto tipo de manipulaciones sobre las fórmulas, pero algunos de ellos no trabajaron bien con los paréntesis y algunas fórmulas terminaron resultando mal formadas.

Ayelén, preocupada por no perder sus avances, decidió ponerse manos a la obra. Eliminó todo lo que estaba dentro de los paréntesis, llaves y corchetes, y te envió sus fórmulas para que indiques si están bien formadas. Entendemos como fórmula bien formada a una serie de paréntesis que siempre están cerrados, y que nunca cierran antes de abrir. Por ejemplo, la fórmula "(([[{}]]))" está bien formada, pero la fórmula ")(())(" no.

Tu trabajo será generar un programa que defina si una fórmula dada está bien formada o no.

---

# Simplificamos el problema antes de resolver

Indicar si un texto de entrada contenido por paréntesis, está correctamente formado.

---

```c++
#include <iostream>
#include <stack>
using namespace std;

int main(int argc, char *argv[]) {
	stack<char> pila;
	string formula;
	
	int contadorParentesis = 0;
	
	cin >> formula;
	
	return 0;
}
```

---

```c++
#include <iostream>
#include <stack>
using namespace std;

int main(int argc, char *argv[]) {
	stack<char> pila;
	string formula;
	
	int contadorParentesis = 0;
	
	cin >> formula;
	
	for (auto thisSymbol : formula) pila.push(thisSymbol);
	
	return 0;
}
```

---

```c++
#include <iostream>
#include <stack>
using namespace std;

int main(int argc, char *argv[]) {
	stack<char> pila;
	string formula;
	
	int contadorParentesis = 0;
	
	cin >> formula;
	
	for (auto thisSymbol : formula) pila.push(thisSymbol);
	
	while (!pila.empty() and 
		   contadorParentesis >= 0) {
		if (pila.top() == ')') contadorParentesis++;
		else if (pila.top() == '(') contadorParentesis--;
		pila.pop();
	}
	
	bool respuesta = contadorParentesis == 0;
	
	cout << boolalpha << respuesta << endl;
	
	return 0;
}
```

# Ejemplo de aplicación

**Problema**

Imaginá que tenés una fila de personas en una parada de bondi. Cada uno tiene un número de entrada al bondi (porque no sé, ponele que el colectivero se puso estricto y ahora cada uno saca su numerito). La cosa es que cuando llega el bondi, cada persona sube en el orden en que sacó el número, pero solo si su número es múltiplo de tres (porque el colectivero también está medio loco y le pinta hacer eso). Los que no, se tienen que esperar al próximo bondi. ¡Clásico quilombo en la parada!

--

### Simplificamos el problema
Ante una serie de ingresos (los vamos a harcodear para simplificar), indicar cuáles suben en orden, y cuáles esperan. Solo esperan los que no son múltiplos de 3.

---

```c++
int main() {
   queue<int> filaBondi;
    
    filaBondi.push(7);
    filaBondi.push(3);
    filaBondi.push(10);
    filaBondi.push(9);
    filaBondi.push(2);
    filaBondi.push(15);
    
    coleMisterioso(filaBondi);

    return 0;
}
```

---

```c++
void coleMisterioso(std::queue<int>& numeros) {
    cout << "Suben: ";
    while (!numeros.empty()) {
        int num = numeros.front();
        numeros.pop();

        if (num % 3 == 0) {
            cout << num << " "; 
        } else {
            cout << "(espera " << num << ") "; 
        }
    }
    cout << endl;
}
```

# Ejemplo de aplicación

**Problema**

En el Centro de Monitoreo de Eventos (CME), Franco es el operador encargado de gestionar y priorizar todas las alertas de seguridad en tiempo real para la ciudad. En el turno nocturno, los eventos de la ciudad comienzan a multiplicarse y Franco necesita una solución para manejar los eventos más recientes, eliminando aquellos eventos viejos que ya no sean relevantes para mantener el flujo de información claro y ordenado.

Se pide implementar un sistema que cumpla con los siguientes requisitos:

* Cada vez que llegue un evento nuevo, debe agregarse al sistema en la posición adecuada para poder visualizarlo de inmediato.
* Si el sistema excede la capacidad de almacenamiento de eventos recientes (por ejemplo, 10 eventos), los eventos más antiguos deben eliminarse automáticamente para dar lugar a los nuevos.
* La lista de eventos debe poder mostrarse en el orden en que ocurrieron, del más reciente al menos reciente, mostrando solo aquellos que aún son relevantes.

Franco confía en tu solución para poder responder ante cualquier eventualidad, asegurándose de mantener a la ciudad segura y en orden.

---

# Simplificamos el problema

Crear una cola doblemente enlazada que permita agregar eventos, eliminar los antiguos y mostrarlos en orden.

---

```c++
int main() {
    deque<string> eventos;
    agregarEvento(eventos, "Usuario inició sesión");
    agregarEvento(eventos, "Usuario cambió configuración");
    agregarEvento(eventos, "Nuevo mensaje recibido");
    agregarEvento(eventos, "Archivo descargado");

    limpiarEventosViejos(eventos, 3);

    mostrarEventos(eventos);
    return 0;
}
```

--

```c++
void agregarEvento(deque<string> & eventos, string & evento) {
    eventos.push_front(evento);
}
```

--

```c++
void limpiarEventosViejos(deque<string> & eventos, unsigned & maxEventos) {
    while (eventos.size() > maxEventos) {
        eventos.pop_back();
    }
}
```

--

```c++
void mostrarEventos(deque<string> & eventos) {
    cout << "Eventos recientes:" << endl;
    for (auto evento : eventos) {
        cout << "- " << evento << endl;
    }
}
```
